name: Windows release recovery

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package without changing its source
        type: choice
        required: true
        default: v0.1.5
        options:
          - v0.1.5

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Check out the original tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - name: Preserve tagged bytes, not Windows checkout line endings
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --force --all
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "c1ce84a09eadd07d6979a69b68d4765ef6b79447"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (including pinned brand digests)
        run: npm run test:unit
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Publish architecture-specific installer
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish x64 portable build
        if: matrix.arch == 'x64'
        run: npx electron-builder --win portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
